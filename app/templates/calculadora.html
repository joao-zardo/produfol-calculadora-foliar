{% extends "base.html" %}
{% block content %}
<a href="{{ url_for('main.index') }}" class="btn btn-link px-0 mb-2">&lt; Voltar ao Menu</a>
<h1 class="h4 mb-3">Nova Recomendação Foliar</h1>
<form method="post" class="card p-3 shadow-sm">
  <div class="mb-3">
    <label for="id_produtor" class="form-label fw-bold">Produtor Rural *</label>
    <select id="id_produtor" name="id_produtor" class="form-select" required>
      {% for p in produtores %}
        <option value="{{ p.id }}">{{ p.nome }} — {{ p.municipio }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label for="id_produto" class="form-label fw-bold">Fertilizante Foliar *</label>
    <select id="id_produto" name="id_produto" class="form-select" required>
      {% for prod in produtos %}
        <option value="{{ prod.id }}">{{ prod.nome }} ({{ prod.dose_padrao_ha }} L/ha | Galão {{ prod.volume_embalagem }} L)</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label for="cultura" class="form-label fw-bold">Cultura *</label>
    <select id="cultura" name="cultura" class="form-select" required>
      <option value="Soja">Soja</option>
      <option value="Milho">Milho</option>
      <option value="Trigo">Trigo</option>
      <option value="Outra">Outra</option>
    </select>
  </div>
  <div class="mb-3">
    <label for="area_hectares" class="form-label fw-bold">Área da Lavoura (hectares) *</label>
    <input type="number" step="0.01" min="0.01" id="area_hectares" name="area_hectares" class="form-control" required>
    <div class="form-text">Informe valor maior que zero, ex.: 25.5</div>
  </div>
  <button type="submit" class="btn btn-produfol w-100">CALCULAR E SALVAR</button>
</form>
{% endblock %}
