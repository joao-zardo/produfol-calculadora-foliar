{% extends "base.html" %}
{% block content %}
<a href="{{ url_for('main.index') }}" class="btn btn-link px-0 mb-2">&lt; Voltar ao Menu</a>
<h1 class="h4 mb-3">Nova Recomendação Foliar</h1>
<form method="post" class="card p-3 shadow-sm">
  <div class="mb-3">
    <label for="id_produtor" class="form-label fw-bold">Produtor Rural *</label>
    <select id="id_produtor" name="id_produtor" class="form-select" required>
      {% for p in produtores %}
        <option value="{{ p.id }}">{{ p.nome }} — {{ p.municipio }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label for="id_produto" class="form-label fw-bold">Fertilizante Foliar *</label>
    <select id="id_produto" name="id_produto" class="form-select" required onchange="atualizarInfoProduto()">
      {% for prod in produtos %}
        <option value="{{ prod.id }}"
                data-dose="{{ prod.dose_padrao_ha }}"
                data-embalagem="{{ prod.volume_embalagem }}"
                data-culturas="{{ prod.culturas_indicadas }}">
          {{ prod.nome }} ({{ prod.dose_padrao_ha }} L/ha | Galão {{ prod.volume_embalagem }} L)
        </option>
      {% endfor %}
    </select>
    <div id="info-produto" class="alert alert-success py-2 px-3 mt-2 mb-0 small d-none" role="status"></div>
  </div>
  <div class="mb-3">
    <label for="cultura" class="form-label fw-bold">Cultura *</label>
    <select id="cultura" name="cultura" class="form-select" required>
      <option value="Soja">Soja</option>
      <option value="Milho">Milho</option>
      <option value="Trigo">Trigo</option>
      <option value="Outra">Outra</option>
    </select>
  </div>
  <div class="mb-3">
    <label for="area_hectares" class="form-label fw-bold">Área da Lavoura (hectares) *</label>
    <input type="number" step="0.01" min="0.01" id="area_hectares" name="area_hectares" class="form-control" required>
    <div class="form-text">Informe valor maior que zero, ex.: 25.5</div>
  </div>
  <button type="submit" class="btn btn-produfol w-100">CALCULAR E SALVAR</button>
</form>

<script>
  function atualizarInfoProduto() {
    const select = document.getElementById('id_produto');
    const opt = select.options[select.selectedIndex];
    const box = document.getElementById('info-produto');
    if (!opt || !opt.value) {
      box.classList.add('d-none');
      box.textContent = '';
      return;
    }
    const dose = opt.getAttribute('data-dose');
    const emb = opt.getAttribute('data-embalagem');
    const culturas = opt.getAttribute('data-culturas');
    box.innerHTML = `<strong>Ficha Técnica:</strong> Dose padrão de <strong>${dose} L/ha</strong> | Galão de <strong>${emb} L</strong> | Culturas indicadas: ${culturas}.`;
    box.classList.remove('d-none');
  }
  document.addEventListener('DOMContentLoaded', atualizarInfoProduto);
</script>
{% endblock %}
